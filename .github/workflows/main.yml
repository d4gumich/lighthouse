name: Sync to Hugging Face hub
on:
  push:
    branches: [main, deployment-test]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - run: echo "This job was automatically triggered by a ${{ github.event_name }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push https://${{vars.HF_USERNAME}}:$HF_TOKEN@huggingface.co/spaces/${{vars.HF_USERNAME}}/${{vars.SPACE_NAME}} main
